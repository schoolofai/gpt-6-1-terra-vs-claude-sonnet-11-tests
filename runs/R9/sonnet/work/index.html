<!DOCTYPE html><html><head><meta charset="utf-8"><title>Windmill</title>
<style>html,body{margin:0;overflow:hidden;background:#ccd}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(devicePixelRatio);
r.shadowMap.enabled=true;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xc9cfd6);s.fog=new THREE.Fog(0xc9cfd6,60,160);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);cam.position.set(0,9,30);
const ctl=new OrbitControls(cam,r.domElement);ctl.target.set(0,9,0);ctl.enableDamping=true;
s.add(new THREE.HemisphereLight(0xffffff,0x557744,0.8));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(20,35,15);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:120});s.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
const add=(g,m,p,par=s)=>{const o=new THREE.Mesh(g,m);o.position.set(...p);o.castShadow=o.receiveShadow=true;par.add(o);return o;};
const green=M(0x1f4a35),white=M(0xf0f0ea),wood=M(0x6b5a45),red=M(0xb01c1c);
add(new THREE.CircleGeometry(150,48),M(0x4f9a3a),[0,0,0]).rotation.x=-Math.PI/2;
// tower: octagonal taper
const tw=add(new THREE.CylinderGeometry(3,5.2,14,8,1),green,[0,7,0]);tw.rotation.y=Math.PI/8;
// cutaway hatch: open box showing interior on +z side
const hatchMat=M(0x120d08);
// balcony
add(new THREE.CylinderGeometry(6.2,6.2,.25,8),wood,[0,5,0]).rotation.y=Math.PI/8;
for(let i=0;i<8;i++){const a=i/8*Math.PI*2,x=Math.sin(a)*5.4,z=Math.cos(a)*5.4;
const b=add(new THREE.BoxGeometry(.2,3,.2),wood,[x*.8,3.7,z*.8]);b.rotation.set(Math.cos(a)*.5,0,-Math.sin(a)*.5);
for(let k=0;k<3;k++){const aa=(i+k/3)/8*Math.PI*2;add(new THREE.BoxGeometry(.1,1,.1),wood,[Math.sin(aa)*6,5.6,Math.cos(aa)*6]);}}
const rail=add(new THREE.TorusGeometry(6,.07,6,8),wood,[0,6.1,0]);rail.rotation.set(Math.PI/2,0,Math.PI/8);
// door
add(new THREE.BoxGeometry(1.2,2.4,.2),red,[0,1.2,5.05]);
// open hatch with dark recess
add(new THREE.BoxGeometry(2.6,2.8,.15),hatchMat,[0,9,3.95]);
// cap
const cap=new THREE.Group();cap.position.set(0,14,0);s.add(cap);
add(new THREE.SphereGeometry(3.3,24,16,0,Math.PI*2,0,Math.PI/2),white,[0,0,0],cap);
add(new THREE.CylinderGeometry(3.3,3.3,1,24),white,[0,-.5,0],cap);
// inner mechanism inside tower, visible through hatch
const inner=new THREE.Group();inner.position.set(0,9,2.2);s.add(inner);
const gear=new THREE.Group();inner.add(gear);
add(new THREE.CylinderGeometry(.9,.9,.3,24),M(0xb08a4a),[0,0,0],gear).rotation.x=Math.PI/2;
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const t=add(new THREE.BoxGeometry(.25,.3,.35),M(0xb08a4a),[Math.cos(a)*1.0,Math.sin(a)*1.0,0],gear);t.rotation.z=a;}
for(let i=0;i<4;i++){const sp=add(new THREE.BoxGeometry(1.8,.12,.2),wood,[0,0,0],gear);sp.rotation.z=i*Math.PI/4;}
const shaft=add(new THREE.CylinderGeometry(.12,.12,3,12),M(0x777777),[0,0,0],inner);shaft.rotation.x=Math.PI/2;
const spot=new THREE.PointLight(0xffcc88,12,8);spot.position.set(0,9.5,3.6);s.add(spot);
// sails hub on cap front (+z)
const hub=new THREE.Group();hub.position.set(0,15,3.4);s.add(hub);
add(new THREE.CylinderGeometry(.35,.35,6,12),M(0x777777),[0,0,-2.2],hub).rotation.x=Math.PI/2;
const rotor=new THREE.Group();hub.add(rotor);
add(new THREE.SphereGeometry(.6,12,12),M(0x1f3a2a),[0,0,.2],rotor);
for(let k=0;k<4;k++){const arm=new THREE.Group();arm.rotation.z=k*Math.PI/2+Math.PI/4;rotor.add(arm);
add(new THREE.BoxGeometry(.25,12,.2),white,[0,7,0],arm);
add(new THREE.BoxGeometry(.2,12,.2),white,[1.6,7,0],arm);
for(let j=0;j<14;j++)add(new THREE.BoxGeometry(1.6,.08,.08),white,[.8,2.2+j*.7,0],arm);
for(let j=0;j<3;j++)add(new THREE.BoxGeometry(.06,10,.06),white,[.5+j*.5,7.2,0],arm);
add(new THREE.BoxGeometry(1.3,5,.04),M(0xeeeeea,{side:THREE.DoubleSide}),[.8,5,0],arm);}
// tail pole at back
const pole=add(new THREE.CylinderGeometry(.12,.15,17,8),white,[0,0,0]);
pole.position.set(0,8,-9);pole.rotation.x=-0.62;pole.position.set(0,7.6,-7.2+ -1.2);
const pole2=add(new THREE.BoxGeometry(.2,.2,1),white,[0,15,-3.3]);
add(new THREE.BoxGeometry(.5,.4,.5),wood,[0,.2,-16]);
function anim(t){requestAnimationFrame(anim);const a=t*0.0006;rotor.rotation.z=-a;gear.rotation.z=-a*1.6;
const ang=t*0.00008;ctl.update();
if(!ctl.__d){const p=cam.position.clone().sub(ctl.target);p.applyAxisAngle(new THREE.Vector3(0,1,0),.0015);cam.position.copy(ctl.target).add(p);}
r.render(s,cam);}
// auto-orbit pauses while user drags
ctl.addEventListener('start',()=>ctl.__d=true);ctl.addEventListener('end',()=>ctl.__d=false);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
anim(0);
</script></body></html>
